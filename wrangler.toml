# ── Cloudflare Worker 配置 ──
# 双轨口令红包谜题 Web 应用
name = "dual-track-redpacket-puzzle"
main = "src/index.js"
compatibility_date = "2026-08-06"

# 静态资源（首页 / 人类页 / 机器人页 / app.js / style.css）
[assets]
directory = "public"
binding = "ASSETS"
# 让请求先进 Worker（这样 /agent 门禁、身份检查、自定义路由才能生效）
run_worker_first = true

# 可公开变量：活动状态 / 挑战版本 / Human KDF 迭代数
[vars]
EVENT_STATE = "ACTIVE"
CHALLENGE_VERSION = "2026-09-redpacket-01"
HUMAN_ITERATIONS = "800000"

[observability]
enabled = true
head_sampling_rate = 1

# ── 注意 ──
# 真正的 Secret（RED_PACKET_PASSWORD / STATE_SIGNING_SECRET）绝不要写进本文件。
# 本地开发：放在 .dev.vars（已 gitignore）
# 生产部署：用  wrangler secret put <NAME>  注入，见交付说明。
